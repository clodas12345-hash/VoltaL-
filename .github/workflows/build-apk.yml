name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 21

    - name: Install Project Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/local-notifications sharp

    - name: Build Web Application
      run: |
        npm run build

    - name: Setup Android Project
      run: |
        # Inicializa o capacitor de forma não-interativa
        npx --yes @capacitor/cli init "VoltaLa" "com.voltala.app" --web-dir dist || true

        # Garante a criação da estrutura completa do Android se o Manifest não existir
        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          rm -rf android
          npx --yes @capacitor/cli add android
        fi

        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          for P in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION INTERNET CAMERA READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE MANAGE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO READ_MEDIA_AUDIO POST_NOTIFICATIONS VIBRATE SCHEDULE_EXACT_ALARM RECORD_AUDIO BLUETOOTH BLUETOOTH_CONNECT BLUETOOTH_SCAN BLUETOOTH_ADMIN READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS READ_CALL_LOG WRITE_CALL_LOG CALL_PHONE READ_PHONE_STATE ACTIVITY_RECOGNITION BODY_SENSORS SYSTEM_ALERT_WINDOW REQUEST_IGNORE_BATTERY_OPTIMIZATIONS WAKE_LOCK FOREGROUND_SERVICE; do
            sed -i "/<application/i <uses-permission android:name=\"android.permission.$P\" />" "$MANIFEST"
          done
        fi

        # Auto-incrementa versionCode para permitir instalar a atualização por cima sem desinstalar
        GRADLE_FILE="android/app/build.gradle"
        if [ -f "$GRADLE_FILE" ]; then
          BUILD_NUM=${{ github.run_number }}
          if [ -z "$BUILD_NUM" ] || [ "$BUILD_NUM" -eq 0 ]; then
            BUILD_NUM=$(date +%s)
          fi
          sed -i "s/versionCode 1/versionCode $BUILD_NUM/g" "$GRADLE_FILE"
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$BUILD_NUM\"/g" "$GRADLE_FILE"
        fi

        # Gera ícones com Safe Zone do Android
        npm run generate-android-icons

        # Sincroniza os assets para o Android
        npx --yes @capacitor/cli sync android

    - name: Decodificar Keystore Fixa a partir do Segredo
      run: |
        echo "Tamanho do segredo (deve ser próximo de 3664):"
        echo -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | wc -c
        if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > release.keystore
          echo "✅ release.keystore decodificado a partir do segredo DEBUG_KEYSTORE_BASE64"
          ls -la release.keystore
        else
          echo "⚠️ Segredo DEBUG_KEYSTORE_BASE64 não encontrado — build vai usar assinatura aleatória"
        fi

    - name: Configurar Keystore Fixo para Assinatura Consistente
      run: |
        mkdir -p ~/.android
        if [ -f "release.keystore" ]; then
          cp release.keystore ~/.android/debug.keystore
          echo "✅ Keystore fixo configurado em ~/.android/debug.keystore (garante mesma assinatura em todos os builds)"
        fi

    - name: Forçar signingConfig do App para Usar o Keystore Fixo
      run: |
        if grep -q "android.signingConfigs.debug.storeFile" android/app/build.gradle; then
          echo "ℹ️ signingConfig já estava forçado — nada a fazer"
          exit 0
        fi
        cat >> android/app/build.gradle << 'EOF'

        android.signingConfigs.debug.storeFile = new File(System.getProperty("user.home") + "/.android/debug.keystore")
        android.signingConfigs.debug.storePassword = "android"
        android.signingConfigs.debug.keyAlias = "androiddebugkey"
        android.signingConfigs.debug.keyPassword = "android"
        android.buildTypes.debug.signingConfig = android.signingConfigs.debug
        EOF
        echo "✅ signingConfig do buildType debug forçado a usar ~/.android/debug.keystore"

    - name: Compilar APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Verificar Fingerprint da Assinatura do APK
      continue-on-error: true
      run: |
        SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
        APK=android/app/build/outputs/apk/debug/app-debug.apk
        APKSIGNER=$(ls $SDK/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
        echo "=== Fingerprint da assinatura deste APK (compare entre builds) ==="
        if [ -z "$APKSIGNER" ]; then
          echo "apksigner nao encontrado - pulando verificacao"
          exit 0
        fi
        "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256\|SHA-1"

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
