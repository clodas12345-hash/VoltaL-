name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Project Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Setup Android Project and Inject Custom Icons
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx @capacitor/cli init "VoltaLá" "com.voltala.app" --web-dir dist
        npx @capacitor/cli add android
        
        # Garante que o ícone oficial GKD Mobility substitua todos os ícones padrão do Android
        for resdir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
          mkdir -p android/app/src/main/res/$resdir
          cp assets/icon.png android/app/src/main/res/$resdir/ic_launcher.png
          cp assets/icon.png android/app/src/main/res/$resdir/ic_launcher_round.png
          cp assets/icon.png android/app/src/main/res/$resdir/ic_launcher_foreground.png
        done
        
        npx @capacitor/cli sync android

    - name: Add Android Permissions to Manifest
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST

    - name: Build Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
