name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install and Build Web App with Bun
      env:
        VITE_GOOGLE_MAPS_API_KEY: "AIzaSyAIJinnkUYTK9D-JfUkvUci-c2vDOVaQDo"
      run: |
        bun install
        bun run build

    - name: Setup Capacitor and Android Platform
      run: |
        bun add @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
        npx @capacitor/cli init "GKD Mobility" "com.voltalinha.app" --web-dir dist
        npx @capacitor/cli add android
        npx @capacitor-assets/cli generate --android || true
        npx @capacitor/cli sync android

    - name: Add Android Permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        sed -i '/<application/i \
        <uses-permission android:name="android.permission.INTERNET" />\
        <uses-permission android:name="android.permission.CAMERA" />\
        <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />\
        <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
        <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"

    - name: Build APK with Gradle
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
