name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: 17

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Project Dependencies
      run: npm install

    - name: Build Web Application
      run: npm run build

    - name: Setup Android Project and Build APK
      run: |
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5 sharp
        
        # Garante a criação da estrutura completa do Android se o Manifest não existir
        npx cap init "VoltaLá" "com.voltala.app" --web-dir dist
        
        if [ ! -f "android/app/src/main/AndroidManifest.xml" ]; then
          rm -rf android
          npx cap add android
        fi
        
        # Injeta permissões de GPS e Internet no AndroidManifest
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if [ -f "$MANIFEST" ]; then
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
        fi
        
        # Gera ícones com Safe Zone do Android
        node scripts/generate-android-icons.cjs
        
        npx cap sync android
        
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
