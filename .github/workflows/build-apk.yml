name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Capacitor CLI and Core
        run: npm install -D @capacitor/cli@5.7.4 @capacitor/core@5.7.4 @capacitor/android@5.7.4 sharp

      - name: Setup Android Project and Generate Safe Zone Icons
        run: |
          npx cap init "VoltaLá" "com.voltala.app" --web-dir dist
          
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Pasta android ja existe, mantendo estrutura"
          fi
          
          node -e "
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          async function run() {
            let src = 'assets/icon.png';
            if (!fs.existsSync(src)) src = 'public/icon.png';
            if (!fs.existsSync(src)) return;

            const buf = fs.readFileSync(src);
            const densities = [
              { name: 'mipmap-mdpi', leg: 48, adapt: 108 },
              { name: 'mipmap-hdpi', leg: 72, adapt: 162 },
              { name: 'mipmap-xhdpi', leg: 96, adapt: 216 },
              { name: 'mipmap-xxhdpi', leg: 144, adapt: 324 },
              { name: 'mipmap-xxxhdpi', leg: 192, adapt: 432 }
            ];

            const resDir = path.join('android', 'app', 'src', 'main', 'res');
            fs.mkdirSync(path.join(resDir, 'values'), { recursive: true });
            fs.writeFileSync(path.join(resDir, 'values', 'ic_launcher_background.xml'), '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#FFFFFF</color>\n</resources>\n');

            fs.mkdirSync(path.join(resDir, 'mipmap-anydpi-v26'), { recursive: true });
            const adaptXml = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <background android:drawable=\"@color/ic_launcher_background\"/>\n    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>\n</adaptive-icon>\n';
            fs.writeFileSync(path.join(resDir, 'mipmap-anydpi-v26', 'ic_launcher.xml'), adaptXml);
            fs.writeFileSync(path.join(resDir, 'mipmap-anydpi-v26', 'ic_launcher_round.xml'), adaptXml);

            for (const d of densities) {
              const target = path.join(resDir, d.name);
              fs.mkdirSync(target, { recursive: true });

              const fgSize = Math.round(d.adapt * 0.60);
              const fgRes = await sharp(buf).resize(fgSize, fgSize, { fit: 'inside', background: { r: 255, g: 255, b: 255, alpha: 0 } }).toBuffer();
              const fgMeta = await sharp(fgRes).metadata();

              await sharp({
                create: { width: d.adapt, height: d.adapt, channels: 4, background: { r: 255, g: 255, b: 255, alpha: 0 } }
              })
              .composite([{ input: fgRes, top: Math.round((d.adapt - fgMeta.height) / 2), left: Math.round((d.adapt - fgMeta.width) / 2) }])
              .png()
              .toFile(path.join(target, 'ic_launcher_foreground.png'));

              const legSize = Math.round(d.leg * 0.85);
              const legRes = await sharp(buf).resize(legSize, legSize, { fit: 'inside', background: { r: 255, g: 255, b: 255, alpha: 1 } }).toBuffer();
              const legMeta = await sharp(legRes).metadata();

              await sharp({
                create: { width: d.leg, height: d.leg, channels: 4, background: { r: 255, g: 255, b: 255, alpha: 1 } }
              })
              .composite([{ input: legRes, top: Math.round((d.leg - legMeta.height) / 2), left: Math.round((d.leg - legMeta.width) / 2) }])
              .png()
              .toFile(path.join(target, 'ic_launcher.png'));

              await sharp({
                create: { width: d.leg, height: d.leg, channels: 4, background: { r: 255, g: 255, b: 255, alpha: 1 } }
              })
              .composite([{ input: legRes, top: Math.round((d.leg - legMeta.height) / 2), left: Math.round((d.leg - legMeta.width) / 2) }])
              .png()
              .toFile(path.join(target, 'ic_launcher_round.png'));
            }
          }
          run();
          "

          npx cap sync android

      - name: Add Android Permissions to Manifest
        run: |
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: voltala-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
