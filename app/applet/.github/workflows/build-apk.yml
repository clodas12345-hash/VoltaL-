name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --legacy-peer-deps

      - name: Generate Assets
        run: node scripts/generate-android-icons.cjs || echo "Skipping custom asset generation"

      - name: Add Android platform
        run: |
          rm -rf android
          npx --yes @capacitor/cli init "VoltaLa" "com.voltala.app" --web-dir dist || true
          npx cap add android

      - name: Sync Capacitor
        run: |
          npx cap sync android
          # Garantir permissão de internet, geolocalização e tráfego em texto claro
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST"
            fi
            if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
              sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' "$MANIFEST"
            fi
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

      - name: Fix Kotlin stdlib conflict
        run: echo 'allprojects { configurations.all { resolutionStrategy.eachDependency { if (requested.group == "org.jetbrains.kotlin") { useVersion("1.9.24") } } } }' >> android/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode debug keystore
        run: |
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/debug.keystore
            echo "Tamanho do arquivo decodificado:"
            ls -la android/app/debug.keystore
          else
            echo "DEBUG_KEYSTORE_BASE64 não definido - usando keystore padrão"
          fi

      - name: Forçar signingConfig do App para Usar o Keystore Fixo
        run: |
          if [ -f "android/app/debug.keystore" ]; then
            cat >> android/app/build.gradle << 'EOF'

          android.signingConfigs.debug.storeFile = new File("${project.projectDir}/debug.keystore")
          android.signingConfigs.debug.storePassword = "android"
          android.signingConfigs.debug.keyAlias = "androiddebugkey"
          android.signingConfigs.debug.keyPassword = "android"
          android.buildTypes.debug.signingConfig = android.signingConfigs.debug
          EOF
            echo "signingConfig do buildType debug forçado a usar android/app/debug.keystore"
          fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee build.log || true
          if grep -q "BUILD FAILED" build.log; then
            echo "===== ERRO REAL ====="
            grep -A 20 "What went wrong" build.log
            exit 1
          fi

      - name: Verificar Fingerprint da Assinatura do APK
        continue-on-error: true
        run: |
          SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(ls $SDK/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "=== Fingerprint da assinatura deste APK (compare entre builds) ==="
          if [ -z "$APKSIGNER" ] || [ ! -f "$APK" ]; then
            echo "apksigner ou APK nao encontrado - pulando verificacao"
            exit 0
          fi
          "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256\|SHA-1"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
